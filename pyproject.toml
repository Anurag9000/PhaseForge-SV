[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseforge-sv"
version = "0.1.0"
description = "PyTorch-only phase-derived speaker verification research"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchaudio>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
plots = ["matplotlib>=3.8"]
search = ["optuna>=4"]
bonus = ["torchgmm==0.1.4", "numpy>=1.26", "nvidia-ml-py>=12"]

[project.scripts]
phaseforge = "phaseforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
