name: Bonus GMM competitor CPU smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/phaseforge/bonus_*'
      - 'configs/bonus*'
      - 'benchmarks/**'
      - 'tests/test_bonus*'
      - 'pyproject.toml'
      - '.github/workflows/bonus-competitors.yml'
  workflow_dispatch:
jobs:
  torchgmm-vs-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch and TorchGMM competitor
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,bonus]'
      - name: Confirm TorchGMM API is installed
        run: |
          python - <<'PY'
          import torch
          from torchgmm.bayes import GaussianMixture
          print("TorchGMM competitor:", GaussianMixture)
          print("PyTorch:", torch.__version__)
          PY
      - name: Measure both competitors on exactly the same synthetic data
        run: |
          python -m phaseforge.bonus_benchmark \
            --config configs/bonus_smoke.json \
            --output runs/bonus_competitors_cpu \
            --backends native torchgmm \
            --device cpu --strict
      - name: Exact identical-parameter Gaussian likelihood parity
        run: |
          python -m phaseforge.bonus_identical_scoring \
            --config configs/bonus_smoke.json \
            --output runs/bonus_identical_cpu \
            --backends torchgmm --device cpu
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('runs/bonus_identical_cpu/cpu_native_smoke/identical_parameter_scoring.json')
          measured = json.loads(path.read_text())
          competitor = measured['results']['torchgmm']
          assert competitor['status'] == 'complete', competitor
          assert competitor['max_abs_logp_diff'] < 1e-3, competitor
          print('Identical TorchGMM native parameters: max log-p delta:',
                competitor['max_abs_logp_diff'])
          PY
      - name: Generate measured, clearly CPU-only bonus report
        run: |
          python -m phaseforge.bonus_report \
            --benchmark runs/bonus_competitors_cpu/bonus_results.json \
            --output runs/bonus_competitors_cpu/CPU_ONLY_BONUS_REPORT.md
      - name: Upload measured results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonus-torchgmm-cpu-smoke
          path: |
            runs/bonus_competitors_cpu/*.csv
            runs/bonus_competitors_cpu/*.json
            runs/bonus_competitors_cpu/*.md
            runs/bonus_identical_cpu/**/*.json
          if-no-files-found: warn
